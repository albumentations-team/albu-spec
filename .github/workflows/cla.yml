---
name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    steps:
    - name: CLA Assistant
      if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event.comment.body == 'recheck' || github.event_name == 'pull_request_target')
      uses: contributor-assistant/github-action@v2.5.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_BOT_TOKEN }}
      with:
        path-to-signatures: '.github/cla-signatures.json'
        path-to-document: 'https://github.com/albumentations-team/albu-spec/blob/main/CLA.md'
        branch: 'main'
        allowlist: 'bot*,dependabot*'
        remote-organization-name: 'albumentations-team'
        remote-repository-name: 'cla-signatures'
        create-file-commit-message: 'Creating file for storing CLA signatures'
        signed-commit-message: '$contributorName has signed the CLA in #$pullRequestNo'
        custom-notsigned-prcomment: 'Thank you for your contribution! Before we can merge your PR, you need to sign our [Contributor License Agreement (CLA)]($pathToCLADocument).<br/><br/>Please comment on this PR with the following text to sign:<br/><br/>**I have read the CLA Document and I hereby sign the CLA**'
        custom-pr-sign-comment: 'Thank you for signing the CLA! 🎉'
        custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
        lock-pullrequest-aftermerge: false
